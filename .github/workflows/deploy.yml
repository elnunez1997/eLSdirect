name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build — inline src/main.js and compass.html into index.html
        run: |
          cat > /tmp/build.py << 'EOF'
          import re

          with open("index.html", encoding="utf-8") as f:
              html = f.read()
          with open("src/main.js", encoding="utf-8") as f:
              main_js = f.read()
          with open("public/compass.html", encoding="utf-8") as f:
              compass_html = f.read()

          # Strip previously inlined script (idempotent)
          html = re.sub(
              r'<script>\s*\n.*?</script>(\s*</body>)',
              r'<script src="src/main.js"></script>\1',
              html, flags=re.DOTALL
          )
          # Strip previously inlined srcdoc (idempotent)
          html = re.sub(
              r'<iframe srcdoc=".*?"(.*?)></iframe>',
              r'<iframe src="public/compass.html"\1></iframe>',
              html, flags=re.DOTALL
          )
          # Inline main.js
          html = html.replace(
              '<script src="src/main.js"></script>',
              "<script>\n" + main_js + "\n</script>"
          )
          # Inline compass.html as srcdoc
          compass_esc = compass_html.replace("&", "&amp;").replace('"', "&quot;")
          srcdoc = (
              '<iframe srcdoc="' + compass_esc +
              '" style="width:100%;height:100%;border:none;" title="eLS Compass"></iframe>'
          )
          html = re.sub(
              r'<iframe src="public/compass\.html" style="width:100%;height:100%;border:none;" title="eLS Compass"></iframe>',
              srcdoc, html
          )
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print(f"Done: {len(html.encode()):,} bytes")
          EOF
          python3 /tmp/build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
