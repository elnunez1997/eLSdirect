<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eLSOP — Formal SOPs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
    </svg>
    eLSOP <span class="badge">GCIT</span>
  </div>
  <nav>
    <a href="index.html">Customer Matrix</a>
    <a href="sops.html" class="active">Formal SOPs</a>
  </nav>
</header>

<div class="page">
  <div class="page-title">
    <h1>Formal SOP Documents</h1>
    <p>Official Standard Operating Procedures for major customers — managed in ACOSTA Relay</p>
  </div>

  <div class="sop-grid" id="sopGrid"></div>
</div>

<footer>
  <p>eLSOP — GCIT Customer SOP Matrix &nbsp;·&nbsp; ACOSTA customers only</p>
  <p class="footer-made">Made with IBM Bob</p>
</footer>

<script src="customers.js"></script>
<script>
const SOPS = [
  { name: "ADUSA Distribution / The Giant Company / Giant Foods / Stop & Shop", file: "ADUSA_Distr_The_Giant_Company_Giant_Foods_Stop_Shop.zip" },
  { name: "Associated Supermarket Group", file: "Associated_Supermarket_Group.docx" },
  { name: "Brookshire Grocery Company", file: "Brookshire_Grocery_Company.docx" },
  { name: "Delhaize", file: "Delhaize.docx" },
  { name: "Demoulas Supermarkets Inc", file: "Demoulas_Supermarkets_Inc.docx" },
  { name: "General Trading", file: "General_Trading.docx" },
  { name: "Golub Corporation", file: "Golub_Corporation.docx" },
  { name: "Harris Teeter Supermarkets", file: "Harris_Teeter_Supermarkets.docx" },
  { name: "HyVee Corporate / Lomar / Perishable Dist of Iowa (PDI)", file: "HyVee_Corporate_Lomar_Perishable_Dist_of_Iowa_PDI.docx" },
  { name: "Kroger / Ralphs / Jake's Finer Foods / Vitacost.com", file: "Kroger_Ralphs_Grocery_Company_Jakes_Finer_Foods_Vitacostcom.zip" },
  { name: "K-V-A-T Food Store Inc", file: "K_V_A_T_Food_Store_Inc.docx" },
  { name: "McLane Company Inc", file: "McLane_Company_Inc.docx" },
  { name: "Mitchell Grocery Company", file: "Mitchell_Grocery_Company.docx" },
  { name: "OK Grocery Co / Giant Eagle", file: "OK_Grocery_Co_Giant_Eagle.docx" },

  { name: "Stater Bros", file: "Stater_Bros.doc" },
  { name: "UNFI Conventional", file: "UNFI_Conventional.docx" },
  { name: "United Natural Foods West / UNFI Accounts Payable", file: "United_Natural_Foods_West_UNFI_Accounts_Payable.docx" },
  { name: "WinCo Foods Inc", file: "Winco_Foods_Inc.docx" },

const grid = document.getElementById("sopGrid");
grid.innerHTML = SOPS.map(s => `
  <div class="sop-card">
    <div class="sop-card-icon">📄</div>
    <div class="sop-card-name">${s.name}</div>
    <a class="sop-card-link" href="sops/${s.file}" download>Download</a>
  </div>`).join("");
</script>
</body>
</html>
