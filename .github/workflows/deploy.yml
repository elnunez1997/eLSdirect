name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build — inline src/main.js and public/compass.html into index.html
        run: |
          set -e

          INDEX="index.html"
          MAIN="src/main.js"
          COMPASS="public/compass.html"

          # Read files
          main_js=$(cat "$MAIN")
          compass_html=$(cat "$COMPASS")

          # Strip any previously inlined script back to src= reference (idempotent)
          python3 - <<'PYEOF'
          import re, sys

          with open("index.html", encoding="utf-8") as f:
              html = f.read()

          with open("src/main.js", encoding="utf-8") as f:
              main_js = f.read()

          with open("public/compass.html", encoding="utf-8") as f:
              compass_html = f.read()

          # 1. Strip previously inlined script → restore src= placeholder
          html = re.sub(
              r'<script>\s*\n.*?</script>(\s*</body>)',
              r'<script src="src/main.js"></script>\1',
              html, flags=re.DOTALL
          )

          # 2. Strip previously inlined srcdoc → restore src= placeholder
          html = re.sub(
              r'<iframe srcdoc=".*?"(.*?)></iframe>',
              r'<iframe src="public/compass.html"\1></iframe>',
              html, flags=re.DOTALL
          )

          # 3. Inline main.js
          inline_script = "<script>\n" + main_js + "\n</script>"
          html = html.replace('<script src="src/main.js"></script>', inline_script)

          # 4. Inline compass.html as srcdoc
          compass_escaped = compass_html.replace("&", "&amp;").replace('"', "&quot;")
          srcdoc_iframe = '<iframe srcdoc="' + compass_escaped + '" style="width:100%;height:100%;border:none;" title="eLS Compass"></iframe>'
          html = re.sub(
              r'<iframe src="public/compass\.html" style="width:100%;height:100%;border:none;" title="eLS Compass"></iframe>',
              srcdoc_iframe,
              html
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

          size = len(html.encode("utf-8"))
          print(f"index.html written ({size:,} bytes)")
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
